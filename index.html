<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C.U.E.P.</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Crimson Text', serif;
            overflow-x: hidden;
            background: #000;
            color: #fff;
        }
        
        /* Shader canvas de fondo */
        #shader-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        
        /* Contenedor principal */
        .container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        
        /* Header/Título */
        .title {
            font-family: 'Space Mono', monospace;
            font-size: clamp(3rem, 12vw, 8rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            text-align: center;
            margin-bottom: 1rem;
            text-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            animation: fadeIn 1.2s ease-out;
        }
        
        .subtitle {
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            text-align: center;
            opacity: 0.9;
            max-width: 600px;
            margin-bottom: 3rem;
            letter-spacing: 0.05em;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            animation: fadeIn 1.5s ease-out 0.3s backwards;
        }
        
        /* Slider */
        .slider-container {
            position: relative;
            width: 80%;
            max-width: 800px;
            margin: 2rem 0;
            animation: fadeIn 1.8s ease-out 0.6s backwards;
        }
        
        .slider {
            position: relative;
            width: 100%;
            overflow: hidden;
        }
        
        .slides {
            display: flex;
            transition: transform 0.5s ease-in-out;
        }
        
        .slide {
            min-width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .slide img {
            width: 760px;
            height: auto;
            display: block;
        }
        
        .slide.blend img {
    mix-blend-mode: exclusion;
    opacity: 0.85;
    filter: contrast(0.5) brightness(1.05);
}

        /* Indicadores de slide */
        .slide-indicators {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        
        .indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .indicator.active {
            background: rgba(255, 255, 255, 0.9);
            width: 24px;
            border-radius: 4px;
        }
        
        /* Hint de teclado */
        .keyboard-hint {
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            opacity: 0.5;
            margin-top: 1rem;
            text-align: center;
            letter-spacing: 0.05em;
        }
        
        /* Links/Navigation */
        .links {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 2rem;
            animation: fadeIn 2.1s ease-out 0.9s backwards;
        }
        
        .link {
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            text-decoration: none;
            color: #fff;
            padding: 0.8rem 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            background: rgba(0, 0, 0, 0.2);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        
        .link:hover {
            border-color: rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.2);
        }
        
        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .slider-container {
                width: 95%;
            }
            
            .links {
                flex-direction: column;
                gap: 1rem;
            }
            
            .link {
                width: 100%;
                max-width: 300px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <canvas id="shader-canvas"></canvas>
    
    <div class="container">
       <!--
        <h1 class="title">C.U.E.P.</h1>
        <p class="subtitle">claves únicas de espectros poéticos</p>
    -->
        <!-- Slider -->
        <div class="slider-container">
            <div class="slider">
                <div class="slides" id="slides">
                    <div class="slide">
                        <img src="../img/04.png">
                    </div>
                    <div class="slide blend">
                        <img src="../img/03.png">
                    </div>
                    <!--
                    <div class="slide">
                        <img src="../img/03.png">
                    </div>
                    <div class="slide">
                        <img src="../img/01.png">
                    </div>
                    -->
                </div>
            </div>
            <div class="slide-indicators">
                <div class="indicator active" data-slide="0"></div>
                <div class="indicator" data-slide="1"></div>
            </div>
           
        </div>
        <!--
        <nav class="links">
            <a href="#" class="link">Eventos</a>
            <a href="#" class="link">Archivo</a>
            <a href="#" class="link">Contacto</a>
        </nav>
        -->
    </div>

    <script>
        // Slider functionality
        let currentSlide = 0;
        const slides = document.getElementById('slides');
        const indicators = document.querySelectorAll('.indicator');
        const totalSlides = 2;

        function goToSlide(n) {
            currentSlide = (n + totalSlides) % totalSlides;
            slides.style.transform = `translateX(-${currentSlide * 100}%)`;
            
            // Update indicators
            indicators.forEach((ind, idx) => {
                ind.classList.toggle('active', idx === currentSlide);
            });
        }

        function nextSlide() {
            goToSlide(currentSlide + 1);
        }

        function prevSlide() {
            goToSlide(currentSlide - 1);
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                prevSlide();
            }
        });

        // Click on indicators
        indicators.forEach((indicator, idx) => {
            indicator.addEventListener('click', () => {
                goToSlide(idx);
            });
        });

        // Touch/swipe support for mobile
        let touchStartX = 0;
        let touchEndX = 0;

        const slider = document.querySelector('.slider');

        slider.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        });

        slider.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            if (touchEndX < touchStartX - 50) {
                nextSlide();
            }
            if (touchEndX > touchStartX + 50) {
                prevSlide();
            }
        }

        // Setup WebGL
        const canvas = document.getElementById('shader-canvas');
        const gl = canvas.getContext('webgl2');
        
        if (!gl) {
            console.error('WebGL2 no disponible');
        }

        // Vertex shader
        const vertexShaderSource = `#version 300 es
            in vec2 position;
            out vec2 vUV;
            
            void main() {
                vUV = position * 0.5 + 0.5;
                gl_Position = vec4(position, 0.0, 1.0);
            }
        `;

        // Fragment shader
        const fragmentShaderSource = `#version 300 es
            precision highp float;
            
            in vec2 vUV;
            out vec4 fragColor;
            
            uniform float time;
            uniform vec2 resolution;
            
            #define SPEED 0.53
            #define COMPLEXITY 4.0
            #define DISTORTION 1.2
            #define SCALE 1.0
            #define BRIGHTNESS 1.0
            #define CONTRAST 1.0
            
            vec3 hexToRGB(int hex) {
                float r = float((hex >> 16) & 0xFF) / 255.0;
                float g = float((hex >> 8) & 0xFF) / 255.0;
                float b = float(hex & 0xFF) / 255.0;
                return vec3(r, g, b);
            }
            
            #define COLOR_BASE hexToRGB(0xe76f51)
            #define COLOR_MID hexToRGB(0x2a9d8f)
            #define COLOR_HIGH hexToRGB(0x000000)
            
            float hash(vec2 p) {
                p = fract(p * vec2(23.34, 456.21));
                p += dot(p, p + 45.32);
                return fract(p.x * p.y);
            }
            
            float noise(vec2 p) {
                vec2 i = floor(p);
                vec2 f = fract(p);
                f = f * f * (3.0 - 2.0 * f);
                
                float a = hash(i);
                float b = hash(i + vec2(1.0, 0.0));
                float c = hash(i + vec2(0.0, 1.0));
                float d = hash(i + vec2(1.0, 1.0));
                
                return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
            }
            
            float fbm(vec2 p) {
                float value = 2.0;
                float amplitude = 1.3;
                float frequency = 0.8;
                
                for(int i = 0; i < int(COMPLEXITY); i++) {
                    value += amplitude * noise(p * frequency);
                    frequency *= 2.02;
                    amplitude *= 0.51;
                }
                
                return value;
            }
            
            float caustic(vec2 uv, float t) {
                vec2 p = uv * SCALE;
                
                p.x += fbm(p + t * 0.008) * DISTORTION;
                p.y += fbm(p.yx - t * 0.013) * DISTORTION;
                
                float c = 0.18;
                
                for(float i = 0.0; i < COMPLEXITY; i++) {
                    float fi = i / COMPLEXITY;
                    vec2 offset = vec2(
                        sin(t * (0.08 + fi * 0.15) + i * 2.0) * 0.2,
                        cos(t * (0.06 + fi * 0.12) + i * 1.5) * 0.2
                    );
                    
                    vec2 q = p + offset;
                    float n = fbm(q + t * (0.01 + fi * 0.05));
                    
                    float wave = sin(n * 13.0 + t + i) * 0.75 + 0.45;
                    c += wave / (1.0 + fi * 1.0);
                }
                
                return c / COMPLEXITY;
            }
            
            void main() {
                vec2 uv = (vUV - 0.5) * resolution / min(resolution.x, resolution.y);
                float t = time * SPEED;
                
                float c1 = caustic(uv, t);
                float c2 = caustic(uv * 2.7, t * 0.8);
                float c3 = caustic(uv * 0.7, t * 0.2);
                
                float combined = (c1 + c2 * 0.5 + c3 * 0.3) / 1.8;
                
                vec3 col = mix(COLOR_BASE, COLOR_MID, smoothstep(0.0, 0.5, combined));
                col = mix(col, COLOR_HIGH, smoothstep(0.15, 1.0, combined));
                
                float highlight = pow(combined, 5.0) * 4.5;
                col += vec3(highlight) * vec3(0.5, 0.8, 1.1);
                
                col = (col - 0.54) * CONTRAST + 0.48;
                col *= BRIGHTNESS;
                
                fragColor = vec4(col, 1.0);
            }
        `;

        // Compile shaders
        function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error('Shader error:', gl.getShaderInfoLog(shader));
                gl.deleteShader(shader);
                return null;
            }
            
            return shader;
        }

        const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
        const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);

        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            console.error('Program error:', gl.getProgramInfoLog(program));
        }

        // Setup geometry
        const positions = new Float32Array([
            -1, -1,
             1, -1,
            -1,  1,
             1,  1
        ]);

        const positionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

        const positionLocation = gl.getAttribLocation(program, 'position');
        gl.enableVertexAttribArray(positionLocation);
        gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

        // Get uniforms
        const timeLocation = gl.getUniformLocation(program, 'time');
        const resolutionLocation = gl.getUniformLocation(program, 'resolution');

        // Resize handler
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            gl.viewport(0, 0, canvas.width, canvas.height);
        }
        
        window.addEventListener('resize', resize);
        resize();

        // Render loop
        gl.useProgram(program);
        let startTime = Date.now();

        function render() {
            const time = (Date.now() - startTime) / 1000;
            
            gl.uniform1f(timeLocation, time);
            gl.uniform2f(resolutionLocation, canvas.width, canvas.height);
            
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
